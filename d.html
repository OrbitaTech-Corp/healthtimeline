<style>
:root { --bg: #EFE8FF; --fg: #2B2147; --desc: #4A3F70; --k: #F25C54; --kx: #FFFFFF; --frame: #0B0F17; --nb: #2B2147; --nf: #FFFFFF; --cb: #FFFFFF; --cf: #2B2147; color-scheme: light; }
* { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: 'DM Sans', system-ui, -apple-system, sans-serif; line-height: 1.5; }
main { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px;

  padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
.top { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700; }
.brand { font-family: 'Sora', system-ui, sans-serif; font-size: 15px; font-weight: 800; color: #14264A; }
.brand span { color: #5E6A75; }
.head { display: flex; align-items: flex-start; gap: 14px; }
.badge { width: 48px; height: 48px; flex-shrink: 0; border-radius: 14px; background: var(--k); color: var(--kx); display: flex; align-items: center; justify-content: center; font-family: 'Sora', system-ui, sans-serif; font-size: 22px; font-weight: 800; }
.head div { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
h1 { margin: 0; font-family: 'Sora', system-ui, sans-serif; font-size: 24px; line-height: 1.15; font-weight: 700; text-wrap: balance; }
.head p { margin: 0; font-size: 15px; color: var(--desc); }
figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.phone { width: 100%; max-width: 406px; aspect-ratio: 406 / 860; border: 8px solid var(--frame); border-radius: 50px; overflow: hidden; background: var(--frame); }
.phone img { display: block; width: 100%; height: 100%; object-fit: cover; }
figcaption { font-family: 'Sora', system-ui, sans-serif; font-size: 15px; font-weight: 700; }
nav { display: flex; flex-direction: column; gap: 12px; padding-top: 8px; }
.next { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 16px; background: var(--nb); color: var(--nf); font-family: 'Sora', system-ui, sans-serif; font-size: 15px; font-weight: 700; text-decoration: none; }
.chips { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.chip { display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 12px; background: var(--cb); color: var(--cf); border: none; font-family: 'Sora', system-ui, sans-serif; font-weight: 700; text-decoration: none; }
.chip.on { background: var(--k); color: var(--kx); border-color: var(--k); }
a:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
footer { text-align: center; font-size: 12px; color: var(--desc); }
</style>
